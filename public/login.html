<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인: 오밥추</title>
  <script>
    (function () {
      var t = localStorage.getItem('obabchu-theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <main id="main" class="auth-wrap">
    <form class="auth-card" id="loginForm">
      <h1>로그인</h1>
      <p class="sub">저장해 둔 추천 기록을 보려면 로그인하세요.</p>
      <p class="form-error" id="formError" role="alert"></p>
      <div class="field">
        <label for="username">아이디</label>
        <input type="text" id="username" name="username" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">로그인</button>
      <p class="auth-foot">계정이 없으면 <a href="/register.html">회원가입</a></p>
    </form>
  </main>
  <script src="/js/common.js"></script>
  <script src="/js/auth.js"></script>
  <script>renderHeader(); initAuthPage('login');</script>
</body>
</html>
