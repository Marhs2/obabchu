<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 — 오밥추</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <form class="auth-card" id="loginForm">
      <h1>로그인</h1>
      <p class="sub">오밥추에 다시 오신 걸 환영해요 🍚</p>
      <div class="field">
        <label>아이디</label>
        <input type="text" id="username" autocomplete="username" placeholder="아이디" required />
      </div>
      <div class="field">
        <label>비밀번호</label>
        <input type="password" id="password" autocomplete="current-password" placeholder="비밀번호" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">로그인</button>
      <p class="auth-foot">계정이 없으신가요? <a href="/register.html">회원가입</a></p>
    </form>
  </div>
  <script src="/js/common.js"></script>
  <script src="/js/auth.js"></script>
  <script>initAuthPage('login');</script>
</body>
</html>
