<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>추천받기 — 오밥추</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="page">
    <div class="container">
      <h1 class="page-title">오늘의 메뉴 추천 🎲</h1>
      <p class="page-sub">내 주변에서 실시간으로 식당을 불러와 추천해드려요.</p>

      <div class="reco-layout">
        <!-- Controls -->
        <aside class="panel">
          <h3>추천 방식</h3>
          <div class="field">
            <div class="mode-toggle" id="modeToggle">
              <button data-mode="random" class="active">🎲 랜덤</button>
              <button data-mode="menu">🍽️ 카테고리·예산</button>
            </div>
          </div>

          <div class="field">
            <label>카테고리 <span id="catHint" style="color:var(--text-mute)"></span></label>
            <div class="chips" id="catChips"></div>
          </div>

          <div class="field" id="budgetField" style="display:none">
            <label>예산 (1인 기준)</label>
            <div class="range-row">
              <input type="range" id="budgetRange" min="5000" max="50000" step="1000" value="10000" />
              <span class="budget-val" id="budgetVal">10,000원</span>
            </div>
          </div>

          <div class="field">
            <label>검색 반경</label>
            <select id="radiusSel">
              <option value="1000">1 km</option>
              <option value="3000">3 km</option>
              <option value="5000" selected>5 km</option>
              <option value="10000">10 km</option>
            </select>
            <div class="loc-status" id="locStatus"><span class="dot"></span><span id="locText">위치 확인 중…</span></div>
          </div>

          <button class="btn btn-primary btn-block btn-lg" id="recoBtn">추천 받기</button>
        </aside>

        <!-- Result -->
        <section class="panel result-panel">
          <div id="resultArea">
            <div class="result-empty">
              <div>
                <div class="big">🍽️</div>
                <p>왼쪽에서 조건을 정하고<br /><b>추천 받기</b> 버튼을 눌러보세요!</p>
              </div>
            </div>
          </div>
          <div id="mapArea"></div>
        </section>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="/js/common.js"></script>
  <script src="/js/recommend.js"></script>
</body>
</html>
