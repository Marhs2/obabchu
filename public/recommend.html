<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>추천받기: 오밥추</title>
  <script>
    (function () {
      var t = localStorage.getItem('obabchu-theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <main id="main" class="page">
    <div class="container">
      <h1 class="page-title">오늘의 메뉴</h1>
      <p class="page-sub">조건을 정한 뒤 추천을 받으면, 식당 정보와 지도가 같이 나옵니다.</p>

      <div class="reco-layout">
        <aside class="panel">
          <h2>조건</h2>
          <div class="ticket-edge" aria-hidden="true"></div>
          <div class="field">
            <span class="field-legend" id="modeLabel">추천 방식</span>
            <div class="mode-toggle" id="modeToggle" role="group" aria-labelledby="modeLabel">
              <button type="button" data-mode="random" aria-pressed="true">랜덤</button>
              <button type="button" data-mode="menu" aria-pressed="false">종류·예산</button>
            </div>
          </div>

          <div class="field">
            <span class="field-legend" id="catLabel">카테고리 <span class="hint" id="catHint">(선택)</span></span>
            <div class="chips" id="catChips" role="group" aria-labelledby="catLabel"></div>
          </div>

          <div class="field" id="budgetField" hidden>
            <label for="budgetRange">1인 예산</label>
            <div class="range-row">
              <input type="range" id="budgetRange" min="5000" max="50000" step="1000" value="10000" />
              <span class="budget-val" id="budgetVal">10,000원</span>
            </div>
          </div>

          <div class="field">
            <label for="radiusSel">검색 반경</label>
            <select id="radiusSel">
              <option value="1000">1 km</option>
              <option value="3000">3 km</option>
              <option value="5000" selected>5 km</option>
              <option value="10000">10 km</option>
            </select>
            <div class="loc-status" id="locStatus">
              <span class="dot" aria-hidden="true"></span>
              <span id="locText">위치를 확인하는 중</span>
            </div>
          </div>

          <button type="button" class="btn btn-primary btn-block btn-lg" id="recoBtn">이걸로 추천</button>
        </aside>

        <section class="panel result-panel" aria-live="polite">
          <div id="resultArea">
            <div class="state">
              <div>
                <h3>아직 고르지 않았습니다</h3>
                <p>왼쪽(휴대폰에서는 위쪽)에서 방식을 고른 뒤 <strong>이걸로 추천</strong>을 누르세요.</p>
              </div>
            </div>
          </div>
          <div id="mapArea"></div>
        </section>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="/js/common.js"></script>
  <script src="/js/recommend.js"></script>
</body>
</html>
